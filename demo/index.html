<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anonymous Age Verification — Demo</title>
  <style>
    :root {
      --bg: #f4f4f6;
      --card: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #e6e6eb;
      --accent: #0a84ff;
      --ok: #1a7f37;
      --bad: #c0392b;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px rgba(0, 0, 0, .06);
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
      --fs-s: 13px; --fs: 15px; --fs-l: 18px; --fs-xl: 27px;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: var(--s8) var(--s4) var(--s12);
      background: var(--bg);
      color: var(--ink);
      font: var(--fs)/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .layout { display: grid; gap: var(--s8); max-width: 1080px; margin: 0 auto; }
    @media (min-width: 1000px) {
      .layout { grid-template-columns: minmax(0, 1fr) 268px; gap: var(--s12); }
    }

    /* Side status for each party */
    .head h1 { font-size: var(--fs-xl); letter-spacing: -.02em; margin: 0 0 var(--s4); }
    .pills { display: flex; flex-wrap: wrap; gap: var(--s2); }
    .pill {
      display: inline-flex; align-items: center; gap: var(--s2);
      font-size: var(--fs-s); color: var(--muted);
      background: var(--card); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }

    /* Stage: one step at a time */
    .stage { min-height: 60vh; }
    .stage h2 { font-size: var(--fs-xl); letter-spacing: -.02em; margin: 0 0 var(--s2); }
    .stage .body { color: var(--muted); max-width: 62ch; margin: 0 0 var(--s6); }
    .caption { color: var(--muted); font-size: var(--fs-s); max-width: 62ch; margin: var(--s4) 0 0; }

    .roles { display: grid; gap: var(--s3); }
    @media (min-width: 700px) { .roles { grid-template-columns: repeat(3, 1fr); } }
    .role { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--s4); }
    .role h3 { margin: 0 0 var(--s1); font-size: var(--fs); }

    /* Exchange: two sides and the channel between them */
    .exchange { margin-top: var(--s2); }
    .sides { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
    .side { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--s4); }
    .side h3 { margin: 0 0 var(--s3); font-size: var(--fs); letter-spacing: -.01em; }
    .inventory { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .inventory li { font-size: var(--fs-s); color: var(--muted); padding-left: 1em; position: relative; }
    .inventory li::before { content: "•"; position: absolute; left: 0; color: var(--accent); }
    .inventory li.plain::before { color: var(--muted); }

    .wire { position: relative; height: 46px; margin-top: var(--s3); }
    .lane { position: absolute; inset: 0; border: 1px dashed var(--line); border-radius: 999px; }
    .chip {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: var(--accent); color: #fff; font-size: var(--fs-s);
      padding: 5px 13px; border-radius: 999px; white-space: nowrap;
      box-shadow: 0 6px 16px rgba(10, 132, 255, .28);
    }

    /* Public / private buckets */
    .buckets { display: grid; gap: var(--s3); margin-top: var(--s6); }
    @media (min-width: 720px) { .buckets { grid-template-columns: repeat(3, 1fr); } }
    .bucket { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); background: var(--card); }
    .bucket h4 { margin: 0 0 var(--s2); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .bucket.alice { border-top: 3px solid var(--accent); }
    .bucket.shared { border-top: 3px solid var(--muted); }
    .bucket.other { border-top: 3px solid #b0b0b8; }
    .bucket ul { margin: 0; padding-left: 1.1em; color: var(--ink); font-size: var(--fs-s); }

    /* What the site has stored */
    .inspector { margin-top: var(--s6); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); }
    .inspector h4 { margin: 0 0 var(--s3); font-size: var(--fs); }
    .inspector dl { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--s4); margin: 0; }
    .inspector dt { color: var(--muted); font-size: var(--fs-s); }
    .inspector dd { margin: 0; }

    .notice { margin-top: var(--s6); border-radius: var(--radius); padding: var(--s4); border: 1px solid; font-size: var(--fs-s); }
    .notice.bad { background: #fdf1f0; border-color: #f3c9c4; color: #8a2b20; }
    .notice.ok { background: #f0f8f2; border-color: #c7e6ce; color: #155f27; }

    table { width: 100%; border-collapse: collapse; margin-top: var(--s4); }
    th, td { text-align: left; padding: var(--s2); border-bottom: 1px solid var(--line); font-size: var(--fs-s); }
    th { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }
    td.ok { color: var(--ok); } td.bad { color: var(--bad); }
    .mono { font-family: var(--mono); }

    /* Floating ID dock */
    .dock { position: sticky; top: var(--s8); }
    .dock-title { font-size: var(--fs); margin: 0 0 var(--s3); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-size: 12px; }
    .id-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--s4); }
    .id-card.empty { background: transparent; box-shadow: none; border-style: dashed; color: var(--muted); display: grid; place-items: center; min-height: 148px; font-size: var(--fs-s); }
    .id-badge { display: inline-block; font-size: var(--fs-s); font-weight: 600; color: var(--ok); }
    .id-card p { margin: 0; }
    .label { margin: var(--s3) 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .dock-note { color: var(--muted); font-size: 12px; margin: var(--s3) 0 0; }
    .small { font-size: var(--fs-s); }

    /* Controls */
    .controls { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); margin-top: var(--s12); }
    button {
      font: inherit; font-weight: 500; color: var(--ink); background: var(--card);
      border: 1px solid var(--line); border-radius: 999px; padding: var(--s2) var(--s6);
      cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease, transform .05s ease;
    }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .35; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: #0774e0; color: #fff; }
    .dots { display: flex; gap: var(--s2); }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .dots i.on { background: var(--accent); }

    .reveal > * { animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="layout">
    <main class="main">
      <header class="head">
        <h1>Anonymous Age Verification</h1>
        <div class="pills" id="status-bar"></div>
      </header>

      <section class="stage" id="stage" aria-live="polite"></section>

      <nav class="controls">
        <button id="back" class="ghost">Back</button>
        <div class="dots" id="dots"></div>
        <button id="next" class="primary">Next</button>
      </nav>
    </main>

    <aside class="dock">
      <p class="dock-title">Alice's ID</p>
      <div class="id-card empty" id="id-card">No ID yet</div>
      <p class="dock-note">Websites never see this. They only ever receive a per-site pseudonym.</p>
    </aside>
  </div>

  <script src="./app.js"></script>
</body>
</html>
